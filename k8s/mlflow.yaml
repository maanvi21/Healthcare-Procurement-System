apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: medisource
spec:
  replicas: 1
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      containers:
        - name: mlflow
          image: medisource/mlflow:latest   # build from infra/mlflow/Dockerfile
          command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
                    "--backend-store-uri", "sqlite:///mlflow/mlflow.db",
                    "--default-artifact-root", "/mlflow/artifacts"]
          ports: [{containerPort: 5000}]
          volumeMounts: [{name: data, mountPath: /mlflow}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mlflow-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: medisource
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: medisource
spec:
  selector: {app: mlflow}
  ports: [{port: 5000, targetPort: 5000}]
