apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medisource-ingress
  namespace: medisource
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  rules:
    - host: medisource.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 80}
