# Demo credentials only — base64 is encoding, not encryption. Replace with a real
# secrets manager (OpenBao/Vault, cloud KMS-backed secrets, sealed-secrets, etc.) before
# any non-local deployment; this file exists so `kubectl apply -f k8s/` works out of the
# box for a demo cluster.
apiVersion: v1
kind: Secret
metadata:
  name: medisource-secrets
  namespace: medisource
type: Opaque
data:
  POSTGRES_USER: bWVkaXNvdXJjZQ==
  POSTGRES_PASSWORD: bWVkaXNvdXJjZV9kZXZfcHc=
  MINIO_ACCESS_KEY: bWVkaXNvdXJjZV9taW5pbw==
  MINIO_SECRET_KEY: bWVkaXNvdXJjZV9taW5pb19zZWNyZXQ=
  DOCUSIGN_INTEGRATION_KEY: ""
  DOCUSIGN_USER_ID: ""
  DOCUSIGN_ACCOUNT_ID: ""
  DOCUSIGN_RSA_PRIVATE_KEY: ""
  DOCUSIGN_CONNECT_HMAC_KEY: ""
  # Base64 of your Groq API key. Empty by default — the document service falls back to
  # its rule-based classifier/extractor when this is blank.
  #   kubectl -n medisource create secret generic medisource-secrets \
  #     --from-literal=GROQ_API_KEY=gsk_... --dry-run=client -o yaml | kubectl apply -f -
  GROQ_API_KEY: ""
