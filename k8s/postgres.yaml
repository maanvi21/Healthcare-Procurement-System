apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: medisource
data:
  init-multiple-dbs.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    DATABASES="medisource_documents medisource_vendors medisource_approvals medisource_inventory medisource_contracts medisource_risk"
    for db in $DATABASES; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        SELECT 'CREATE DATABASE $db OWNER $POSTGRES_USER'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db')\gexec
    EOSQL
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: medisource
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: medisource-secrets, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: medisource-secrets, key: POSTGRES_PASSWORD}}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init-script, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "medisource"]}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-script
          configMap: {name: postgres-init, defaultMode: 0755}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: medisource
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
