apiVersion: v1
kind: Secret
metadata:
  name: inventory-intelligence-db
  namespace: medisource
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://medisource:medisource_dev_pw@postgres:5432/medisource_inventory"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-intelligence
  namespace: medisource
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory-intelligence}}
  template:
    metadata: {labels: {app: inventory-intelligence}}
    spec:
      containers:
        - name: inventory-intelligence
          image: medisource/inventory-intelligence:latest
          envFrom:
            - configMapRef: {name: medisource-config}
            - secretRef: {name: inventory-intelligence-db}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-intelligence
  namespace: medisource
spec:
  selector: {app: inventory-intelligence}
  ports: [{port: 8000, targetPort: 8000}]
