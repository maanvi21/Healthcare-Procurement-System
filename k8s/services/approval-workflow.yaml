apiVersion: v1
kind: Secret
metadata:
  name: approval-workflow-db
  namespace: medisource
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://medisource:medisource_dev_pw@postgres:5432/medisource_approvals"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-workflow
  namespace: medisource
spec:
  replicas: 1
  selector: {matchLabels: {app: approval-workflow}}
  template:
    metadata: {labels: {app: approval-workflow}}
    spec:
      containers:
        - name: approval-workflow
          image: medisource/approval-workflow:latest
          envFrom:
            - configMapRef: {name: medisource-config}
            - secretRef: {name: approval-workflow-db}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: approval-workflow
  namespace: medisource
spec:
  selector: {app: approval-workflow}
  ports: [{port: 8000, targetPort: 8000}]
