apiVersion: v1
kind: Secret
metadata:
  name: notification-agent-db
  namespace: medisource
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://medisource:medisource_dev_pw@postgres:5432/medisource_notifications"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-agent
  namespace: medisource
spec:
  replicas: 1
  selector: {matchLabels: {app: notification-agent}}
  template:
    metadata: {labels: {app: notification-agent}}
    spec:
      containers:
        - name: notification-agent
          image: medisource/notification-agent:latest
          envFrom:
            - configMapRef: {name: medisource-config}
            - secretRef: {name: notification-agent-db}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-agent
  namespace: medisource
spec:
  selector: {app: notification-agent}
  ports: [{port: 8000, targetPort: 8000}]
