<text x="52" y="789" font-size="11.5" fill="#6b7280" font-family="Helvetica, Arial, sans-serif">offline training (once per model version)</text>
<rect x="330" y="780" width="16" height="10" fill="#ecfdf5" stroke="#059669"/>
<text x="352" y="789" font-size="11.5" fill="#6b7280" font-family="Helvetica, Arial, sans-serif">the supervised model core</text>
<rect x="590" y="780" width="16" height="10" fill="#fff7ed" stroke="#ea580c"/>
<text x="612" y="789" font-size="11.5" fill="#6b7280" font-family="Helvetica, Arial, sans-serif">unsupervised anomaly branch (per-vendor, no fixed dataset)</text>
<rect x="1010" y="780" width="16" height="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="1032" y="789" font-size="11.5" fill="#6b7280" font-family="Helvetica, Arial, sans-serif">published event + downstream consumers</text>
