<svg viewBox="0 0 1560 820" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Diagram of the risk_intelligence ML pipeline: the two CSV files, the six-headed gradient boosting risk model trained offline via MLflow, the per-vendor IsolationForest anomaly detector, and how their outputs become the risk.assessed event consumed by approval_workflow and notification_agent.">
<rect x="0" y="0" width="1560" height="820" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
  </marker>
</defs>
<text x="780.0" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">Vendor Risk Scoring — Data &amp; Model Architecture</text>
<text x="780.0" y="55" text-anchor="middle" font-size="13" fill="#6b7280" font-family="Helvetica, Arial, sans-serif">services/risk_intelligence — how the two CSVs, the trained model, and the anomaly detector fit together</text>
<rect x="30" y="76" width="1500" height="176" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="7,5"/>
<text x="50" y="98" font-size="12.5" font-weight="700" letter-spacing="0.04em" fill="#6366f1" font-family="Helvetica, Arial, sans-serif">OFFLINE TRAINING — RUN ONCE, VIA NOTEBOOKS/RISK_MODEL_TRAINING.IPYNB</text>
<rect x="55" y="121" width="300" height="105" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
<text x="205.0" y="150.5" text-anchor="middle" font-size="14" font-weight="600" fill="#6366f1" font-family="Helvetica, Arial, sans-serif">vendor_risk_training_data.csv</text>
<text x="205.0" y="168.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">4,000 synthetic rows</text>
<text x="205.0" y="186.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">17 feature cols + 6 label cols</text>
<text x="205.0" y="204.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">generate_training_data(seed=42)</text>
<line x1="355" y1="173.5" x2="400" y2="173.5" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="377.5" y="167.5" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Helvetica, Arial, sans-serif">80/20 split</text>
<rect x="400" y="121" width="320" height="105" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
<text x="560.0" y="150.5" text-anchor="middle" font-size="14" font-weight="600" fill="#6366f1" font-family="Helvetica, Arial, sans-serif">train_model()</text>
<text x="560.0" y="168.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">MultiOutputRegressor</text>
<text x="560.0" y="186.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">6 × GradientBoostingRegressor</text>
<text x="560.0" y="204.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">n_estimators=150, depth=3, lr=0.08</text>
<line x1="720" y1="173.5" x2="765" y2="173.5" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="742.5" y="167.5" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Helvetica, Arial, sans-serif">log_model()</text>
<rect x="765" y="121" width="330" height="105" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
<text x="930.0" y="159.5" text-anchor="middle" font-size="14" font-weight="600" fill="#6366f1" font-family="Helvetica, Arial, sans-serif">MLflow tracking + registry</text>
<text x="930.0" y="177.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">params · metrics · model artifact</text>
<text x="930.0" y="195.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">version N → stage: Production</text>
<line x1="1095" y1="173.5" x2="1140" y2="173.5" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1117.5" y="167.5" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Helvetica, Arial, sans-serif">export</text>
<rect x="1140" y="121" width="340" height="105" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
<text x="1310.0" y="150.5" text-anchor="middle" font-size="14" font-weight="600" fill="#6366f1" font-family="Helvetica, Arial, sans-serif">vendor_risk_model.pkl</text>
<text x="1310.0" y="168.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">joblib-pickled MultiOutputRegressor</text>
<text x="1310.0" y="186.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">models/vendor_risk_model_card.json</text>
<text x="1310.0" y="204.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">(this repo's static export of one run)</text>
<text x="50" y="286" font-size="12.5" font-weight="700" letter-spacing="0.04em" fill="#059669" font-family="Helvetica, Arial, sans-serif">LIVE INFERENCE — ONE ASSESSMENT PER VENDOR EVENT</text>
<rect x="40" y="300" width="230" height="100" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
<text x="155.0" y="327.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">16 other features</text>
<text x="155.0" y="345.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">vendor master data</text>
<text x="155.0" y="363.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">(license, GSTIN, watchlist)</text>
<text x="155.0" y="381.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">+ measured behavior (analytics.py)</text>
<line x1="270" y1="350.0" x2="320" y2="350.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="320" y="300" width="190" height="100" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
<text x="415.0" y="336.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">17-feature vector</text>
<text x="415.0" y="354.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">app/features.py</text>
<text x="415.0" y="372.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">build_feature_vector()</text>
<line x1="510" y1="350.0" x2="560" y2="350.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560" y="300" width="230" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="675.0" y="336.0" text-anchor="middle" font-size="14" font-weight="600" fill="#059669" font-family="Helvetica, Arial, sans-serif">Production model</text>
<text x="675.0" y="354.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">.predict()</text>
<text x="675.0" y="372.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">6 fitted GBR heads</text>
<polyline points="1180,226 1180,280 640.5,280 640.5,300" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="650.5" y="274" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Helvetica, Arial, sans-serif">loaded by get_or_train_model()</text>
<line x1="790" y1="350.0" x2="840" y2="350.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="840" y="300" width="260" height="100" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
<text x="970.0" y="336.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">6 risk scores  (0–1 each)</text>
<text x="970.0" y="354.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">compliance · fraud · financial</text>
<text x="970.0" y="372.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">supplier · spend · operational</text>
<line x1="1100" y1="350.0" x2="1150" y2="350.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1150" y="300" width="320" height="100" rx="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
<text x="1310.0" y="327.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">overall_risk_and_band()</text>
<text x="1310.0" y="345.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">0.5×mean + 0.5×worst</text>
<text x="1310.0" y="363.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">critical override if any dim ≥ 0.80</text>
<text x="1310.0" y="381.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">→ overall_risk + band (low/med/high)</text>
<polyline points="1310.0,400 1310.0,446" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1180" y="446" width="260" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="1310.0" y="471.0" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb" font-family="Helvetica, Arial, sans-serif">risk.assessed</text>
<text x="1310.0" y="488.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">Kafka event</text>
<polyline points="1258.0,506 1258.0,546" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="1362.0,506 1362.0,546" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1000" y="546" width="250" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="1125.0" y="564.75" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">approval_workflow</text>
<text x="1125.0" y="581.25" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">vendor_risk_band → OPA</text>
<text x="1125.0" y="597.75" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">picks the approver chain</text>
<rect x="1290" y="546" width="250" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="1415.0" y="564.75" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">notification_agent</text>
<text x="1415.0" y="581.25" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">risk.assessed →</text>
<text x="1415.0" y="597.75" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">multi-channel alert</text>
<text x="50" y="656" font-size="12.5" font-weight="700" letter-spacing="0.04em" fill="#ea580c" font-family="Helvetica, Arial, sans-serif">ANOMALY DETECTOR — FIT PER VENDOR AT REQUEST TIME, NO PERSISTED MODEL</text>
<rect x="40" y="670" width="330" height="100" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="205.0" y="706.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ea580c" font-family="Helvetica, Arial, sans-serif">anomaly_demo_vendor_invoices.csv</text>
<text x="205.0" y="724.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">44 rows · 3 demo vendors</text>
<text x="205.0" y="742.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">vendor_id, timestamp, amount</text>
<line x1="370" y1="720.0" x2="450" y2="720.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="450" y="670" width="300" height="100" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="600.0" y="706.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ea580c" font-family="Helvetica, Arial, sans-serif">detect()  —  app/anomaly.py</text>
<text x="600.0" y="724.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">IsolationForest over own invoice history</text>
<text x="600.0" y="742.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">+ spend-spike / peer-outlier / burst rules</text>
<line x1="750" y1="720.0" x2="830" y2="720.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="830" y="670" width="260" height="100" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="960.0" y="715.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">anomaly_flag + reasons</text>
<text x="960.0" y="732.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Helvetica, Arial, sans-serif">GET /risk/anomalies</text>
<polyline points="525.0,670 525.0,420 415.0,420 415.0,400" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="785.0" y="434" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Helvetica, Arial, sans-serif">anomaly_score  (1 of the 17 features)</text>
