# MediSource AI API gateway — single origin for the frontend + all seven services.
# Every service keeps its own route prefix (e.g. document_intelligence's FastAPI router
# is mounted at /documents), so /api/<service-prefix>/... maps 1:1 onto the upstream's
# own path — no path rewriting needed, which keeps this config trivial to extend.
#
# Each service gets two blocks: an exact match for the bare prefix (GET /api/documents,
# no trailing slash — e.g. "list all") and a prefix match for everything under it (POST
# /api/documents/ingest, GET /api/documents/<id>, ...). Nginx's prefix-location matching
# treats a location without a trailing slash as matching by string-prefix, so without the
# exact block a bare "/api/documents" request would fail to match "/api/documents/" and
# fall through to the frontend location instead of the API.

client_max_body_size 25m;

server {
    listen 80;
    server_name _;

    # OCR processing can be slow on first call; 300s covers cold-start model load + inference
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    proxy_set_header X-User-Role $http_x_user_role;
    proxy_set_header X-User-Id $http_x_user_id;
    proxy_set_header X-User-Name $http_x_user_name;
    proxy_set_header Authorization $http_authorization;

    location = /api/documents { proxy_pass http://document_intelligence:8000/documents; proxy_set_header Host $host; }
    location /api/documents/ { proxy_pass http://document_intelligence:8000/documents/; proxy_set_header Host $host; }

    location = /api/vendors { proxy_pass http://vendor_intelligence:8000/vendors; proxy_set_header Host $host; }
    location /api/vendors/ { proxy_pass http://vendor_intelligence:8000/vendors/; proxy_set_header Host $host; }

    location = /api/approvals { proxy_pass http://approval_workflow:8000/approvals; proxy_set_header Host $host; }
    location /api/approvals/ { proxy_pass http://approval_workflow:8000/approvals/; proxy_set_header Host $host; }

    location = /api/inventory { proxy_pass http://inventory_intelligence:8000/inventory; proxy_set_header Host $host; }
    location /api/inventory/ { proxy_pass http://inventory_intelligence:8000/inventory/; proxy_set_header Host $host; }

    location = /api/contracts { proxy_pass http://contract_intelligence:8000/contracts; proxy_set_header Host $host; }
    location /api/contracts/ { proxy_pass http://contract_intelligence:8000/contracts/; proxy_set_header Host $host; }

    location = /api/risk { proxy_pass http://risk_intelligence:8000/risk; proxy_set_header Host $host; }
    location /api/risk/ { proxy_pass http://risk_intelligence:8000/risk/; proxy_set_header Host $host; }

    location = /api/notifications { proxy_pass http://notification_agent:8000/notifications; proxy_set_header Host $host; }
    location /api/notifications/ { proxy_pass http://notification_agent:8000/notifications/; proxy_set_header Host $host; }

    # per-service health checks, e.g. /api/health/documents
    location /api/health/documents { proxy_pass http://document_intelligence:8000/health; }
    location /api/health/vendors { proxy_pass http://vendor_intelligence:8000/health; }
    location /api/health/approvals { proxy_pass http://approval_workflow:8000/health; }
    location /api/health/inventory { proxy_pass http://inventory_intelligence:8000/health; }
    location /api/health/contracts { proxy_pass http://contract_intelligence:8000/health; }
    location /api/health/risk { proxy_pass http://risk_intelligence:8000/health; }
    location /api/health/notifications { proxy_pass http://notification_agent:8000/health; }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
    }
}
